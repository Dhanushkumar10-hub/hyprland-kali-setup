# Cyberpunk Kali Linux Hyprland Configuration
# For the most rad desktop environment ever created

########################## MONITOR SETUP ##########################
monitor=,preferred,auto,1

########################## STARTUP APPS ##########################
exec-once = waybar
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg -m fill &
exec-once = swaylock -c 0a0e14 &

########################## ENVIRONMENT VARIABLES ##########################
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic

########################## INPUT CONFIGURATION ##########################
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    
    follow_mouse = 1
    
    touchpad {
        natural_scroll = no
    }
}

########################## GENERAL SETTINGS ##########################
general {
    # gaps
    gaps_in = 8
    gaps_out = 12
    border_size = 2
    
    # Colors
    col.active_border = rgba(00ff66ff) rgba(00ffffff) 45deg
    col.inactive_border = rgba(595959aa)
    
    layout = dwindle
    
    # Please see https://wiki.hyprland.org/Configuring/Window-Rules/ for more
    allow_tearing = false
}

########################## DECORATION ##########################
decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    
    rounding = 8
    multisample_edges = true
    
    # Opacity
    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0
    
    # Blur
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }
    
    # Shadow
    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a2eff)
}

########################## ANIMATIONS ##########################
animations {
    enabled = yes
    
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

########################## LAYOUT ##########################
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below.
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = slave
}

gestures {
    workspace_swipe = off
}

########################## WINDOW RULES ##########################
windowrule = float,^(pavucontrol)$
windowrule = float,^(blueman-manager)$
windowrule = float,^(nm-connection-editor)$
windowrule = float,^(rofi)$
windowrule = move center,^(rofi)$
windowrule = size 800 600,^(rofi)$

########################## KEYBINDINGS ##########################
$mainMod = SUPER

# Terminal
bind = $mainMod, Return, exec, kitty

# Application Launcher
bind = $mainMod, Space, exec, rofi -show drun -theme ~/.config/rofi/config.rasi

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 0

# Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Brightness control
bind = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Audio control
bind = ,XF86AudioRaiseVolume, exec, pamixer -i 5
bind = ,XF86AudioLowerVolume, exec, pamixer -d 5
bind = ,XF86AudioMute, exec, pamixer -t

# Lock screen
bind = $mainMod, L, exec, swaylock -c 0a0e14

# Screenshot
bind = ,Print, exec, scrot -e 'mv $f ~/Screenshots/' && notify-send 'Screenshot taken'
bind = $mainMod, Print, exec, scrot -s -e 'mv $f ~/Screenshots/' && notify-send 'Screenshot taken'

# System monitor
bind = $mainMod, I, exec, kitty -e htop

########################## MISCELLANEOUS ##########################
misc {
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot on the default wallpaper
    disable_hyprland_logo = false
}

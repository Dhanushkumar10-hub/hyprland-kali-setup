# Cyberpunk Kali Linux Starship Configuration

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character\
"""

add_newline = false

[username]
show_always = true
format = "[$user]($style)@"
style_user = "bold #00ff66"
style_root = "bold #ff0055"

[hostname]
show_always = true
format = "[$hostname]($style) "
style = "bold #00ffff"
ssh_only = false

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "
style = "bold #00ff66"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
format = "on [$symbol$branch]($style) "
style = "bold #ff00ff"
symbol = "󰊢 "

[git_status]
format = "([\\($all_status$ahead_behind\\)]($style) )?"
style = "bold #ff0055"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[character]
success_symbol = "[➜]($style) "
error_symbol = "[✗]($style) "
style_success = "bold #00ff66"
style_error = "bold #ff0055"

# Cyberpunk Kali Linux Kitty Configuration

########################## FONTS ##########################
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 11

########################## CURSOR ##########################
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_interval 0

########################## SCROLLBACK ##########################
scrollback_lines 10000

########################## MOUSE ##########################
select_by_word_characters @-./_~?&=%+#

########################## COLORS ##########################
# Cyberpunk Neon Theme

background #0a0e14
foreground #00ff66

# Black
color0 #000000
color8 #555555

# Red
color1 #ff0055
color9 #ff0055

# Green
color2 #00ff66
color10 #00ff66

# Yellow
color3 #ffff00
color11 #ffff00

# Blue
color4 #0088ff
color12 #0088ff

# Magenta
color5 #ff00ff
color13 #ff00ff

# Cyan
color6 #00ffff
color14 #00ffff

# White
color7 #ffffff
color15 #ffffff

# Cursor
cursor #00ff66
cursor_text_color #0a0e14

# Selection
selection_background #00ff66
selection_foreground #0a0e14

########################## WINDOW ##########################
window_padding_width 8
window_padding_height 8
window_margin_width 0
window_margin_height 0
window_border_width 1
window_border_width 0

# Transparency
background_opacity 0.9

########################## BELL ##########################
build_bell_on_visual_bell yes

########################## TITLEBAR ##########################
macos_show_window_title_in_menubar yes

########################## LAYOUT ##########################
enabled_layouts tall, stack

########################## TABS ##########################
tab_bar_edge top
tab_bar_style powerline
tab_bar_margin_color #0a0e14
tab_bar_background #0a0e14

########################## KEYBINDINGS ##########################
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+l next_layout
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

########################## SHELL ##########################
shell zsh
shell_integration enabled
